<!DOCTYPE html><meta charset="utf-8"><title>Virtual Focus Input Probe</title>
<style>
  body {
    font: 20px system-ui;
    padding: 40px;
  }
  input {
    display: block;
    width: 600px;
    height: 40px;
    margin: 12px;
  }
  li {
    padding: 8px;
  }
  output {
    white-space: pre-wrap;
    display: block;
  }
</style>
<label
  >Primary query<input
    type="text"
    id="primary"
    aria-label="Primary query"
    aria-haspopup="listbox"
    aria-owns="choices"
    aria-controls="choices"
    aria-autocomplete="list"></label>
<ul id="choices" role="listbox" aria-label="Query suggestions"></ul>
<label>Unrelated input<input type="text" id="other" aria-label="Unrelated input"></label>
<p>The suggestion receives accessibility focus while typing remains in Primary query.</p>
<output id="result" aria-live="polite"></output>
<script>
  const primary = document.querySelector("#primary"),
    other = document.querySelector("#other"),
    list = document.querySelector("#choices"),
    result = document.querySelector("#result");
  let version = 0;
  function report() {
    result.textContent = JSON.stringify({
      primary: primary.value,
      other: other.value,
      active: document.activeElement.id,
    });
  }
  function update() {
    const option = document.createElement("li");
    option.id = "suggestion-" + ++version;
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", "true");
    option.textContent = primary.value + " suggestion";
    list.replaceChildren(option);
    primary.setAttribute("aria-activedescendant", option.id);
    report();
  }
  primary.addEventListener("focus", update);
  primary.addEventListener("input", () => {
    update();
    if (primary.value.endsWith("!")) {
      other.focus();
      report();
    }
  });
  other.addEventListener("input", report);
  other.addEventListener("focus", report);
  update();
  primary.focus();
</script>
