[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-toolkit"
version = "0.0.1"
description = "Programmatic desktop interaction for agents"
requires-python = ">=3.12"
dependencies = [
    "regex>=2024.11.6",
    "mcp>=1.30,<2",
    "pillow>=12.3,<13",
]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:cli"
computer-use-build = "computer_use_native_tools.native:buildCli"
computer-use-permissions = "computer_use_native_tools.native:permissionsCli"
computer-use-linux-session = "computer_use_native_tools.native:linuxLauncherCli"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "OPEN_SOURCE_SOFTWARE_NOTICE.md"]

[tool.setuptools.package-data]
computer_use = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
docstring-code-format = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
