[build-system]
requires = [
    "setuptools>=68",
    "wheel>=0.41.2",
    "pillow>=12.3,<13",
    "regex>=2024.11.6",
    "pip>=23.1; sys_platform == 'linux'",
]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-computeruse"
version = "0.0.1"
description = "Programmatic desktop interaction for agents"
requires-python = ">=3.11"
dependencies = [
    "regex>=2024.11.6",
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
agent = [
    "anyio>=4.5",
    "mcp>=1.30,<2",
    "openjiuwen>=0.1.19.post3; python_version < '3.14'",
    "prompt-toolkit>=3.0.51,<4",
    "rich>=13,<15",
]

[dependency-groups]
test = [
    "mcp>=1.30,<2",
    "pytest>=8.3.5",
    "pytest-html>=4.1.1",
    "pytest-cov>=7.0.0",
]
lint = [
    "ruff==0.15.15",
    "pylint==3.3.9",
    "astroid==3.3.11",
    "isort==6.1.0",
    "pycodestyle==2.14.0",
]
build = [
    "build>=1.2.2",
    "setuptools>=68",
    "wheel>=0.41.2",
]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "build" }]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:cli"
computer-use-build = "computer_use_native_tools.native:build_cli"
computer-use-permissions = "computer_use_native_tools.native:permissions_cli"
computer-use-linux-session = "computer_use_native_tools.native:linux_launcher_cli"
computer-use-agent = "computer_use_agent.cli.main:cli"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "OPEN_SOURCE_SOFTWARE_NOTICE.md"]

[tool.setuptools.package-data]
computer_use = ["*.pyi", "py.typed"]
"computer_use_agent.cli" = ["config.example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-v", "--html=outputs/unit_test_report.html", "--self-contained-html", "--ignore=build"]

[tool.coverage.run]
source = ["computer_use", "computer_use_mcp"]
omit = ["tests/*"]

[tool.pylint.MAIN]
ignore-paths = ["^tests/.*"]
load-plugins = ["pylint.extensions.bad_builtin"]
py-version = "3.11"

[tool.pylint."DEPRECATED BUILTINS"]
bad-functions = ["print"]

[tool.pylint.FORMAT]
max-line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = [
    "T201", "N802", "N804", "N805", "N807",
    "B006", "B012", "B014", "B023", "B025", "B904",
    "G001", "G002", "G003", "G004",
    "S101", "S306", "S506", "S602", "T100", "TID251",
    "PLE0303", "PLE0305", "PLE0307", "PLE0308", "PLE0309", "RUF032",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jsonpickle.encode" = { msg = "G.SER.04 禁止使用 jsonpickle 序列化数据" }
"jsonpickle.decode" = { msg = "G.SER.04 禁止使用 jsonpickle 反序列化数据" }
"jsonpickle.dumps" = { msg = "G.SER.04 禁止使用 jsonpickle 序列化数据" }
"jsonpickle.loads" = { msg = "G.SER.04 禁止使用 jsonpickle 反序列化数据" }

[tool.ruff.format]
docstring-code-format = false

[tool.codecheck]
advisory = ["G.TYP.05", "G.OPR.04"]
pylint-select = ["C0301", "C0411", "W0201", "W0212"]
timeout = 120

[tool.codecheck.source-packages]
computer_use = "computer_use_engine"
computer_use_engine = "computer_use_engine"
computer_use_agent = "computer_use_agent"
computer_use_mcp = "interface_adapter/mcp"
computer_use_native_tools = "scripts"
computer_use_linux = "os_adapter/linux/src/computer_use_linux"
