[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-linux"
version = "0.0.1"
description = "Protocol 6 Linux driver for native desktop observations and input"
requires-python = ">=3.10"
dependencies = ["python-xlib==0.33", "Pillow==11.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
