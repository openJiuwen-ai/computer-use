    <clipPath id="inside"><use href="#shape"/></clipPath>
    <linearGradient id="body-tone" gradientUnits="userSpaceOnUse" x1="30" y1="27" x2="40.2" y2="45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#F3F4F4" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#DDE3E6" stop-opacity="1"/>
      <stop offset="1" stop-color="#BCCBD1" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="soft-light" gradientUnits="userSpaceOnUse" cx="30.15" cy="27.9" r="12.3">
      <stop stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity="0.058"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
