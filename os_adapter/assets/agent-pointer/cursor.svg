  <title>A — 冷瓷白 · 圆形渐隐光晕</title>
  <desc>Porcelain-white agent pointer with a circular grey-blue halo fading smoothly to transparent. Canvas 50.4x50.4; hotspot 18.9,17.85; halo radius 23.625; peak halo opacity 40%.</desc>
