      <stop offset="0" stop-color="#A5BBCB" stop-opacity="0.4000000"/>
      <stop offset="0.0625" stop-color="#A5BBCB" stop-opacity="0.3931670"/>
      <stop offset="0.125" stop-color="#A5BBCB" stop-opacity="0.3731670"/>
      <stop offset="0.1875" stop-color="#A5BBCB" stop-opacity="0.3414652"/>
      <stop offset="0.25" stop-color="#A5BBCB" stop-opacity="0.3003956"/>
      <stop offset="0.3125" stop-color="#A5BBCB" stop-opacity="0.2529991"/>
      <stop offset="0.375" stop-color="#A5BBCB" stop-opacity="0.2027972"/>
      <stop offset="0.4375" stop-color="#A5BBCB" stop-opacity="0.1535004"/>
      <stop offset="0.5" stop-color="#A5BBCB" stop-opacity="0.1086523"/>
      <stop offset="0.5625" stop-color="#A5BBCB" stop-opacity="0.0712086"/>
      <stop offset="0.625" stop-color="#A5BBCB" stop-opacity="0.0430522"/>
      <stop offset="0.6875" stop-color="#A5BBCB" stop-opacity="0.0244419"/>
      <stop offset="0.75" stop-color="#A5BBCB" stop-opacity="0.0133984"/>
      <stop offset="0.8125" stop-color="#A5BBCB" stop-opacity="0.0062800"/>
