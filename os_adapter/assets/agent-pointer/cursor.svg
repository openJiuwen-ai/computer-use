<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" fill="none">
  <title>A — 冷瓷白 · 圆形渐隐光晕</title>
  <desc>Porcelain-white agent pointer with a circular grey-blue halo fading smoothly to transparent. Canvas 72x72; hotspot 27,25.5; halo radius 33.75; peak halo opacity 40%.</desc>
  <defs>
    <path id="shape" d="M 29.6025 27.0375
      L 42.9225 36.375
      C 43.7775 36.975 43.5675 38.325 42.5325 38.5725
      L 37.6575 39.7275
      C 36.5775 39.9825 35.6175 40.605 34.95 41.49
      L 32.6175 44.5875
      C 31.95 45.4725 30.5475 45.12 30.39 44.0175
      L 28.275 27.825
      C 28.17 27.075 28.9875 26.595 29.6025 27.0375
      Z "/>
    <path id="halo-shape" d="M 69.75 36
      C 69.75 54.63960975 54.63960975 69.75 36 69.75
      C 17.36039025 69.75 2.25 54.63960975 2.25 36
      C 2.25 17.36039025 17.36039025 2.25 36 2.25
      C 54.63960975 2.25 69.75 17.36039025 69.75 36 Z"/>
