      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".40" stop-color="#F3F8FF" stop-opacity=".60"/>
      <stop offset=".64" stop-color="#CCD8E8" stop-opacity=".10"/>
